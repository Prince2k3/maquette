name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The full test suite runs on the host: ~95% of the tests are pure geometry and data code, and
  # the handful that need RealityKit or Metal run fine on an Apple-silicon macOS runner.
  test-macos:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  # The other platforms build-check only: their platform views are #if os(...) gated, so a macOS
  # test run compiles none of them, and nothing else catches an iOS- or visionOS-only break.
  build-platforms:
    name: Build (${{ matrix.name }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS Simulator
            destination: generic/platform=iOS Simulator
          - name: visionOS Simulator
            destination: generic/platform=visionOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Download platform if needed
        if: matrix.name == 'visionOS Simulator'
        run: xcodebuild -downloadPlatform visionOS -quiet || true
      - name: Build
        run: >
          xcodebuild build -scheme Maquette
          -destination '${{ matrix.destination }}'
          -skipPackagePluginValidation
